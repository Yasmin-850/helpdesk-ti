<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuários | Helpdesk TI</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:#f5f7fb;color:#1e293b}.top{background:#172554;color:#fff;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none}.wrap{max-width:1100px;margin:30px auto;padding:0 20px}.card{background:#fff;border:1px solid #e5eaf2;border-radius:14px;padding:22px;margin-bottom:22px;box-shadow:0 4px 16px #0f172a0a}h1,h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #d9e0ea;border-radius:8px}.btn{border:0;border-radius:8px;padding:11px 16px;font-weight:600;cursor:pointer;background:#3156c8;color:#fff}.btn.sec{background:#e2e8f0;color:#334155}.btn.view{background:#0f766e;padding:8px 12px}.btn.edit{background:#d97706;padding:8px 12px}.btn.danger{background:#dc2626;padding:8px 12px}.acoes{display:flex;gap:6px;flex-wrap:wrap}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf0f5;font-size:13px}th{color:#64748b}.msg{margin-top:12px;font-weight:600;font-size:13px}.ok{color:#16a34a}.erro{color:#dc2626}.overlay{position:fixed;inset:0;background:#0f172a99;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.overlay.on{display:flex}.modal{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:560px;box-shadow:0 20px 50px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{margin:0}.x{border:0;background:#e2e8f0;border-radius:8px;font-size:20px;width:36px;height:36px;cursor:pointer}.detalhe{background:#f8fafc;border-radius:9px;padding:11px 13px;margin:8px 0}.detalhe b{display:block;font-size:12px;color:#64748b;margin-bottom:4px}@media(max-width:700px){.grid{grid-template-columns:1fr}.acoes{min-width:240px}}</style></head><body>
<div class="top"><strong>🎧 Helpdesk TI — Gerenciamento de usuários</strong><a href="/">← Voltar ao Dashboard</a></div><main class="wrap">
<div class="card"><h1>Usuários</h1><p>Cadastre contas para administradores e solicitantes.</p><form id="formUsuario"><div class="grid"><div class="field"><label>Nome</label><input id="nome" required></div><div class="field"><label>E-mail</label><input id="email" type="email" required></div><div class="field"><label>Senha inicial</label><input id="senha" type="password" minlength="6" required></div><div class="field"><label>Perfil</label><select id="perfil"><option value="SOLICITANTE">Solicitante</option><option value="ADMIN">Administrador</option></select></div><div class="field"><label>Setor</label><input id="setor" placeholder="Ex.: Recepção, Financeiro, TI"></div></div><button class="btn" type="submit">＋ Cadastrar usuário</button><div id="msgCadastro" class="msg"></div></form></div>
<div class="card"><h2>Usuários cadastrados</h2><table><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Setor</th><th>Ações</th></tr></thead><tbody id="lista"></tbody></table></div>
<div class="card"><h2>Alterar minha senha</h2><form id="formSenha"><div class="grid"><div class="field"><label>Senha atual</label><input id="senhaAtual" type="password" required></div><div class="field"><label>Nova senha</label><input id="novaSenha" type="password" minlength="6" required></div></div><button class="btn" type="submit">Alterar senha</button><div id="msgSenha" class="msg"></div></form></div>
</main>
<div id="modalVer" class="overlay"><div class="modal"><div class="modal-head"><h2>Detalhes do usuário</h2><button class="x" onclick="fechar('modalVer')">×</button></div><div class="detalhe"><b>ID</b><span id="vId"></span></div><div class="detalhe"><b>Nome</b><span id="vNome"></span></div><div class="detalhe"><b>E-mail</b><span id="vEmail"></span></div><div class="detalhe"><b>Perfil</b><span id="vPerfil"></span></div><div class="detalhe"><b>Setor</b><span id="vSetor"></span></div><br><button class="btn sec" onclick="fechar('modalVer')">Fechar</button></div></div>
<div id="modalEditar" class="overlay"><div class="modal"><div class="modal-head"><h2>Editar usuário</h2><button class="x" onclick="fechar('modalEditar')">×</button></div><form id="formEditar"><input type="hidden" id="eId"><div class="grid"><div class="field"><label>Nome</label><input id="eNome" required></div><div class="field"><label>E-mail</label><input id="eEmail" type="email" required></div><div class="field"><label>Perfil</label><select id="ePerfil"><option value="SOLICITANTE">Solicitante</option><option value="ADMIN">Administrador</option></select></div><div class="field"><label>Setor</label><input id="eSetor"></div></div><button class="btn" type="submit">Salvar alterações</button> <button class="btn sec" type="button" onclick="fechar('modalEditar')">Cancelar</button><div id="msgEditar" class="msg"></div></form></div></div>
<script>
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
async function erro(r){try{const j=await r.json();return j.detail||j.message||'Não foi possível concluir.'}catch{return 'Não foi possível concluir.'}}
async function carregar(){const r=await fetch('/api/usuarios');if(r.status===401){location='/login';return}if(r.status===403){location='/';return}const us=await r.json();document.getElementById('lista').innerHTML=us.map(u=>`<tr><td>${esc(u.nome)}</td><td>${esc(u.email)}</td><td>${u.perfil==='ADMIN'?'Administrador':'Solicitante'}</td><td>${esc(u.setor||'-')}</td><td><div class="acoes"><button class="btn view" onclick="visualizar(${u.id})">👁 Visualizar</button><button class="btn edit" onclick="editar(${u.id})">✏️ Editar</button><button class="btn danger" onclick="excluirUsuario(${u.id}, '${esc(u.nome).replaceAll("'",'&#039;')}')">🗑 Excluir</button></div></td></tr>`).join('')||'<tr><td colspan="5">Nenhum usuário.</td></tr>'}
async function obter(id){const r=await fetch(`/api/usuarios/${id}`);if(!r.ok){alert(await erro(r));return null}return r.json()}
async function visualizar(id){const u=await obter(id);if(!u)return;vId.textContent='#'+u.id;vNome.textContent=u.nome;vEmail.textContent=u.email;vPerfil.textContent=u.perfil==='ADMIN'?'Administrador':'Solicitante';vSetor.textContent=u.setor||'-';document.getElementById('modalVer').classList.add('on')}
async function editar(id){const u=await obter(id);if(!u)return;eId.value=u.id;eNome.value=u.nome;eEmail.value=u.email;ePerfil.value=u.perfil;eSetor.value=u.setor||'';msgEditar.textContent='';document.getElementById('modalEditar').classList.add('on')}
function fechar(id){document.getElementById(id).classList.remove('on')}
async function excluirUsuario(id,nome){if(!confirm(`Tem certeza que deseja excluir o usuário ${nome}?`))return;const r=await fetch(`/api/usuarios/${id}`,{method:'DELETE'});if(r.ok){alert('Usuário excluído com sucesso!');await carregar()}else alert(await erro(r))}
document.getElementById('formEditar').onsubmit=async e=>{e.preventDefault();const r=await fetch(`/api/usuarios/${eId.value}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome:eNome.value,email:eEmail.value,perfil:ePerfil.value,setor:eSetor.value})});if(r.ok){msgEditar.className='msg ok';msgEditar.textContent='Usuário atualizado com sucesso!';await carregar();setTimeout(()=>fechar('modalEditar'),500)}else{msgEditar.className='msg erro';msgEditar.textContent=await erro(r)}};
document.getElementById('formUsuario').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('msgCadastro');const r=await fetch('/api/usuarios',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome:nome.value,email:email.value,senha:senha.value,perfil:perfil.value,setor:setor.value})});if(r.ok){m.className='msg ok';m.textContent='Usuário cadastrado com sucesso!';e.target.reset();await carregar()}else{m.className='msg erro';m.textContent=await erro(r)}};
document.getElementById('formSenha').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('msgSenha');const r=await fetch('/api/usuarios/minha-senha',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({senhaAtual:senhaAtual.value,novaSenha:novaSenha.value})});if(r.ok){m.className='msg ok';m.textContent='Senha alterada com sucesso!';e.target.reset()}else{m.className='msg erro';m.textContent=await erro(r)}};
document.querySelectorAll('.overlay').forEach(x=>x.addEventListener('click',e=>{if(e.target===x)x.classList.remove('on')}));carregar();
</script></body></html>
