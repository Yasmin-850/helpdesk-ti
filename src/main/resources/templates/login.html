<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Helpdesk TI</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial;background:#f5f7fb;color:#1e293b;min-height:100vh;display:grid;place-items:center}.box{width:min(430px,92vw);background:#fff;border:1px solid #e5eaf2;border-radius:18px;padding:34px;box-shadow:0 20px 55px rgba(15,23,42,.12)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.icon{width:48px;height:48px;border-radius:13px;background:#3156c8;color:#fff;display:grid;place-items:center;font-size:24px}.brand h1{font-size:21px;margin:0}.brand p{margin:3px 0 0;color:#64748b;font-size:13px}label{display:block;font-size:13px;font-weight:600;margin:16px 0 7px}input{width:100%;padding:12px 13px;border:1px solid #d9e0ea;border-radius:9px;font:inherit;outline:none}input:focus{border-color:#3156c8;box-shadow:0 0 0 3px rgba(49,86,200,.09)}button{width:100%;margin-top:22px;padding:12px;border:0;border-radius:9px;background:#3156c8;color:#fff;font-weight:700;cursor:pointer}.erro{display:none;margin-top:15px;padding:10px;border-radius:8px;background:#feeceb;color:#b42318;font-size:13px}.demo{margin-top:22px;padding:14px;background:#f8fafc;border-radius:10px;font-size:12px;color:#64748b;line-height:1.65}.demo strong{color:#334155}</style></head>
<body><main class="box"><div class="brand"><div class="icon">🎧</div><div><h1>Helpdesk TI</h1><p>Central de Suporte</p></div></div><h2 style="font-size:20px;margin:0">Entrar no sistema</h2><p style="color:#64748b;font-size:13px">Use seu usuário para acessar os chamados.</p><form id="form"><label>E-mail</label><input id="email" type="email" required autocomplete="username"><label>Senha</label><input id="senha" type="password" required autocomplete="current-password"><button id="btn">Entrar</button><div class="erro" id="erro">E-mail ou senha inválidos.</div></form></main>
<script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('btn'),erro=document.getElementById('erro');erro.style.display='none';btn.disabled=true;btn.textContent='Entrando...';try{const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),senha:senha.value})});if(!r.ok)throw 0;location.href='/';}catch(_){erro.style.display='block'}finally{btn.disabled=false;btn.textContent='Entrar'}})</script></body></html>
