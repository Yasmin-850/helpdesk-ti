spring.application.name=helpdesk-ti

# Banco local por padrão. Em hospedagem, use DB_URL, DB_USERNAME e DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/helpdeskdb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Console H2 (útil somente no desenvolvimento local)
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console

# Sessão e erros
server.servlet.session.timeout=30m
server.error.include-message=always
server.port=${PORT:8080}
